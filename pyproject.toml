[project]
name = "hive-mind"
version = "0.4.1"
description = "Athene Hive Mind: shared, searchable Claude Code / Codex session history: hook, CLI and agent skill."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hive-mind = "hive_mind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hive_mind.py", "scrub_patterns.json", "skills", "vision.md"]
